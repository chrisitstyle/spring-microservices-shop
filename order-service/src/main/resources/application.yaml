spring:
  application:
    name: order-service

  cloud:
    openfeign:
      oauth2:
        enabled: true
        client-registration-id: order-service-client

      client:
        config:
          product-service:
            connectTimeout: 2000
            readTimeout: 2000

          user-service:
            connectTimeout: 2000
            readTimeout: 2000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/spring-shop}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/spring-shop/protocol/openid-connect/certs}

      client:
        registration:
          order-service-client:
            provider: keycloak
            client-id: order-service-client
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_post

        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8080/realms/spring-shop/protocol/openid-connect/token}

  http:
    clients:
      connect-timeout: 2s
      read-timeout: 2s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:order_user}
    password: ${DB_PASSWORD:order_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    template:
      observation-enabled: true

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer


server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents

  endpoint:
    health:
      show-details: always

  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}

    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http

  otlp:
    metrics:
      export:
        enabled: false
resilience4j:
  circuitbreaker:
    instances:
      productService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        event-consumer-buffer-size: 20

        record-exceptions:
          - pl.chrisitstyle.order.exception.ExternalServiceException

        ignore-exceptions:
          - pl.chrisitstyle.order.exception.OrderCreationException

  retry:
    instances:
      userService:
        max-attempts: 3
        wait-duration: 300ms
        event-consumer-buffer-size: 20

        retry-exceptions:
          - pl.chrisitstyle.order.exception.ExternalServiceException

        ignore-exceptions:
          - pl.chrisitstyle.order.exception.OrderCreationException

      productService:
        max-attempts: 3
        wait-duration: 300ms
        event-consumer-buffer-size: 20

        retry-exceptions:
          - pl.chrisitstyle.order.exception.ExternalServiceException

        ignore-exceptions:
          - pl.chrisitstyle.order.exception.OrderCreationException

      productServiceRelease:
        max-attempts: 3
        wait-duration: 300ms
        event-consumer-buffer-size: 20

        retry-exceptions:
          - pl.chrisitstyle.order.exception.ExternalServiceException

        ignore-exceptions:
          - pl.chrisitstyle.order.exception.OrderCreationException

logging:
  structured:
    format:
      console: ecs


app:
  saga:
    recovery:
      stale-after-ms: 120000
      initial-delay-ms: 30000
      fixed-delay-ms: 30000
      lease-ms: 120000
      batch-size: 10


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

  instance:
    instance-id: ${spring.application.name}:${server.port}