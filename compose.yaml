services:
  product-db:
    image: postgres:17

    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_password

    ports:
      - "5433:5432"

    volumes:
      - product-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-db:
    image: postgres:17

    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_password

    ports:
      - "5434:5432"

    volumes:
      - user-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:17

    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password

    ports:
      - "5435:5432"

    volumes:
      - order-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:17

    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password

    ports:
      - "5436:5432"

    volumes:
      - notification-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-db:
    image: postgres:17

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password

    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  pact-broker-db:
    image: postgres:17

    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact_broker_user
      POSTGRES_PASSWORD: pact_broker_password

    volumes:
      - pact-broker-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact_broker_user -d pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: start-dev --import-realm

    ports:
      - "8080:8080"

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password

      KC_HOSTNAME: http://localhost:8080

      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET}

    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro

    depends_on:
      keycloak-db:
        condition: service_healthy

  pact-broker-server:
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0

    ports:
      - "9292:9292"

    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact_broker_user:pact_broker_password@pact-broker-db:5432/pact_broker
      PACT_BROKER_BASE_URLS: "http://localhost:9292 http://host.docker.internal:9292"
      PACT_BROKER_LOG_LEVEL: INFO
      PACT_DO_NOT_TRACK: "true"

    depends_on:
      pact-broker-db:
        condition: service_healthy

  redis:
    image: redis:8-alpine

    ports:
      - "6379:6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10

  discovery-server:
    build:
      context: ./discovery-server

    ports:
      - "8761:8761"

  product-service:
    build:
      context: ./product-service

    ports:
      - "8181:8081"

    environment:
      DB_URL: jdbc:postgresql://product-db:5432/product_db
      DB_USERNAME: product_user
      DB_PASSWORD: product_password

      JWT_ISSUER_URI: http://localhost:8080/realms/spring-shop
      JWT_JWK_SET_URI: http://keycloak:8080/realms/spring-shop/protocol/openid-connect/certs

      OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces

      MANAGEMENT_OBSERVATIONS_ENABLE_SPRING_SECURITY: "false"

      REDIS_HOST: redis
      REDIS_PORT: 6379

      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: product-service
      EUREKA_INSTANCE_INSTANCE_ID: product-service-1:8081

    depends_on:
      product-db:
        condition: service_healthy

      keycloak:
        condition: service_started

      tempo:
        condition: service_started

      redis:
        condition: service_healthy

      discovery-server:
        condition: service_started

  product-service-2:
    build:
      context: ./product-service

    ports:
      - "8182:8081"

    environment:
      DB_URL: jdbc:postgresql://product-db:5432/product_db
      DB_USERNAME: product_user
      DB_PASSWORD: product_password

      JWT_ISSUER_URI: http://localhost:8080/realms/spring-shop
      JWT_JWK_SET_URI: http://keycloak:8080/realms/spring-shop/protocol/openid-connect/certs

      OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces

      MANAGEMENT_OBSERVATIONS_ENABLE_SPRING_SECURITY: "false"

      REDIS_HOST: redis
      REDIS_PORT: 6379

      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: product-service-2
      EUREKA_INSTANCE_INSTANCE_ID: product-service-2:8081

    depends_on:
      product-db:
        condition: service_healthy

      keycloak:
        condition: service_started

      tempo:
        condition: service_started

      redis:
        condition: service_healthy

      discovery-server:
        condition: service_started

  user-service:
    build:
      context: ./user-service

    ports:
      - "8082:8082"

    environment:
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_USERNAME: user_user
      DB_PASSWORD: user_password

      JWT_ISSUER_URI: http://localhost:8080/realms/spring-shop
      JWT_JWK_SET_URI: http://keycloak:8080/realms/spring-shop/protocol/openid-connect/certs

      OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces

      MANAGEMENT_OBSERVATIONS_ENABLE_SPRING_SECURITY: "false"

      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service
      EUREKA_INSTANCE_INSTANCE_ID: user-service:8082

    depends_on:
      user-db:
        condition: service_healthy

      keycloak:
        condition: service_started

      discovery-server:
        condition: service_started

  order-service:
    build:
      context: ./order-service

    ports:
      - "8083:8083"

    environment:
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_USERNAME: order_user
      DB_PASSWORD: order_password

      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      JWT_ISSUER_URI: http://localhost:8080/realms/spring-shop
      JWT_JWK_SET_URI: http://keycloak:8080/realms/spring-shop/protocol/openid-connect/certs

      ORDER_SERVICE_CLIENT_SECRET: ${ORDER_SERVICE_CLIENT_SECRET}
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/spring-shop/protocol/openid-connect/token

      OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces

      MANAGEMENT_OBSERVATIONS_ENABLE_SPRING_SECURITY: "false"

      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: order-service
      EUREKA_INSTANCE_INSTANCE_ID: order-service:8083

      CONFIG_SERVER_URL: http://config-server:8888

    depends_on:
      order-db:
        condition: service_healthy

      product-service:
        condition: service_started

      product-service-2:
        condition: service_started

      user-service:
        condition: service_started

      kafka:
        condition: service_healthy

      keycloak:
        condition: service_started

      tempo:
        condition: service_started

      discovery-server:
        condition: service_started

  api-gateway:
    build:
      context: ./api-gateway

    ports:
      - "8085:8085"
      - "9085:9085"

    environment:
      JWT_ISSUER_URI: http://localhost:8080/realms/spring-shop
      JWT_JWK_SET_URI: http://keycloak:8080/realms/spring-shop/protocol/openid-connect/certs

      OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces

      MANAGEMENT_OBSERVATIONS_ENABLE_SPRING_SECURITY: "false"

      EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      EUREKA_INSTANCE_INSTANCE_ID: api-gateway:8085

    depends_on:
      product-service:
        condition: service_started

      product-service-2:
        condition: service_started

      order-service:
        condition: service_started

      tempo:
        condition: service_started

      discovery-server:
        condition: service_started

  notification-service:
    build:
      context: ./notification-service

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092

      DB_URL: jdbc:postgresql://notification-db:5432/notification_db
      DB_USERNAME: notification_user
      DB_PASSWORD: notification_password

      MANAGEMENT_OBSERVATIONS_ENABLE_SPRING_SECURITY: "false"

      OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces

    depends_on:
      kafka:
        condition: service_healthy

      notification-db:
        condition: service_healthy

      tempo:
        condition: service_started

  config-server:
    build:
      context: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      CONFIG_REPO_LOCATION: file:/config-repo
    volumes:
      - ./config-repo:/config-repo:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

    depends_on:
      product-service:
        condition: service_started

      user-service:
        condition: service_started

      order-service:
        condition: service_started

      notification-service:
        condition: service_started

      api-gateway:
        condition: service_started

  grafana:
    image: grafana/grafana

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning

    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

    depends_on:
      - prometheus
      - tempo
      - loki

  tempo:
    image: grafana/tempo:3.0.2

    command:
      - "-target=all"
      - "-config.file=/etc/tempo.yaml"

    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.7.0

    command:
      - "-config.file=/etc/loki/loki.yaml"

    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:latest

    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

    depends_on:
      - loki

  alertmanager:
    image: prom/alertmanager:v0.33.1

    ports:
      - "9093:9093"

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  alert-webhook:
    build:
      context: ./monitoring/alert-webhook

volumes:
  product-db-data:
  user-db-data:
  order-db-data:
  notification-db-data:
  keycloak-db-data:
  pact-broker-db-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
  alloy-data:
  alertmanager-data:
