apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: spring-shop

spec:
  selector:
    app: redis

  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: spring-shop

spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image: redis:8-alpine

          ports:
            - name: redis
              containerPort: 6379

          resources:
            requests:
              cpu: "50m"
              memory: 64Mi

            limits:
              cpu: "500m"
              memory: 256Mi

          readinessProbe:
            tcpSocket:
              port: 6379

            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 6379

            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
