# ============================================================
# API GATEWAY
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: api-gateway
  namespace: spring-shop

spec:
  type: NodePort

  selector:
    app: api-gateway

  ports:
    - name: http
      port: 8085
      targetPort: 8085
      nodePort: 30085

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: spring-shop

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: api-gateway
          image: spring-shop/api-gateway:k8s-local
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8085

            - name: management
              containerPort: 9085

          resources:
            requests:
              cpu: "100m"
              memory: 256Mi

            limits:
              cpu: "1"
              memory: 768Mi

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9085

            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9085

            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9085

            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          env:
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: spring-shop-config
                  key: PRODUCT_SERVICE_URL

            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: spring-shop-config
                  key: ORDER_SERVICE_URL

            - name: JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: spring-shop-config
                  key: JWT_ISSUER_URI

            - name: JWT_JWK_SET_URI
              valueFrom:
                configMapKeyRef:
                  name: spring-shop-config
                  key: JWT_JWK_SET_URI

            - name: OTEL_TRACES_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: spring-shop-config
                  key: OTEL_TRACES_ENDPOINT

            - name: MANAGEMENT_OBSERVATIONS_ENABLE_SPRING_SECURITY
              valueFrom:
                configMapKeyRef:
                  name: spring-shop-config
                  key: MANAGEMENT_OBSERVATIONS_ENABLE_SPRING_SECURITY
