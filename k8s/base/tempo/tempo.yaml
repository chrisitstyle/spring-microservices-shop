apiVersion: v1
kind: Service

metadata:
  name: tempo
  namespace: spring-shop

spec:
  selector:
    app: tempo

  ports:
    - name: http
      port: 3200
      targetPort: 3200

    - name: otlp-grpc
      port: 4317
      targetPort: 4317

    - name: otlp-http
      port: 4318
      targetPort: 4318

---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: tempo-data
  namespace: spring-shop

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: tempo
  namespace: spring-shop

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tempo

  template:
    metadata:
      labels:
        app: tempo

    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: tempo
          image: grafana/tempo:3.0.2

          args:
            - -target=all
            - -config.file=/etc/tempo.yaml

          ports:
            - name: http
              containerPort: 3200

            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318

          volumeMounts:
            - name: config
              mountPath: /etc/tempo.yaml
              subPath: tempo.yaml
              readOnly: true

            - name: data
              mountPath: /var/tempo

      volumes:
        - name: config
          configMap:
            name: tempo-config

        - name: data
          persistentVolumeClaim:
            claimName: tempo-data
