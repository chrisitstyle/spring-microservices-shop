apiVersion: v1
kind: Service

metadata:
  name: keycloak
  namespace: spring-shop

spec:
  type: NodePort

  selector:
    app: keycloak

  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: keycloak
  namespace: spring-shop

spec:
  replicas: 1

  selector:
    matchLabels:
      app: keycloak

  template:
    metadata:
      labels:
        app: keycloak

    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.1

          args:
            - start-dev
            - --import-realm

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spring-shop-secrets
                  key: KEYCLOAK_ADMIN_USERNAME

            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-shop-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD

            - name: KC_DB
              value: postgres

            - name: KC_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: spring-shop-config
                  key: KEYCLOAK_DB_URL

            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: spring-shop-secrets
                  key: KEYCLOAK_DB_USERNAME

            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spring-shop-secrets
                  key: KEYCLOAK_DB_PASSWORD

            - name: KC_HOSTNAME
              value: http://localhost:8080

            - name: ORDER_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: spring-shop-secrets
                  key: ORDER_SERVICE_CLIENT_SECRET

          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true

      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
