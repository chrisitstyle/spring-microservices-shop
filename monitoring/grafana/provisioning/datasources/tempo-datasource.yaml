apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false

    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-2s"
        spanEndTimeShift: "2s"

        tags:
          - key: service.name
            value: service_name

        filterByTraceID: false
        filterBySpanID: false

        customQuery: true
        query: '{$${__tags}} | json | traceId="$${__trace.traceId}"'
