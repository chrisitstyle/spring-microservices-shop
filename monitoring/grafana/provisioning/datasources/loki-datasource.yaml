apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false

    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"([a-fA-F0-9]{32})"'
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace"
