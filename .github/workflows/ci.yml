name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-tests:
    name: Test ${{ matrix.service }}

    runs-on: ubuntu-latest

    timeout-minutes: 25

    strategy:
      fail-fast: false

      matrix:
        service:
          - api-gateway
          - product-service
          - user-service
          - order-service
          - notification-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Make Maven Wrapper executable
        working-directory: ${{ matrix.service }}
        run: chmod +x mvnw

      - name: Verify Java
        run: java --version

      - name: Verify Docker
        run: docker info

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: >
          ./mvnw
          -B
          test
          "-Dsurefire.excludes=**/*PactTest.*"

  contract-tests:
    name: Pact contract tests

    needs:
      - service-tests

    runs-on: ubuntu-latest

    timeout-minutes: 20

    env:
      PACT_BROKER_BASE_URL: http://localhost:9292
      PACT_VERSION: ${{ github.sha }}
      PACT_BRANCH: ${{ github.head_ref || github.ref_name }}
      BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            order-service/pom.xml
            product-service/pom.xml

      - name: Make Maven Wrappers executable
        run: |
          chmod +x order-service/mvnw
          chmod +x product-service/mvnw

      - name: Verify Docker
        run: docker info

      - name: Start Pact Broker
        run: |
          docker compose up -d pact-broker-db pact-broker-server

      - name: Wait for Pact Broker
        run: |
          echo "Waiting for Pact Broker..."

          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              http://localhost:9292/diagnostic/status/dependencies \
              > /dev/null; then

              echo "Pact Broker is ready."
              exit 0
            fi

            echo "Pact Broker not ready yet - attempt ${attempt}/30"
            sleep 2
          done

          echo "Pact Broker did not become ready."
          docker compose ps
          docker compose logs pact-broker-db pact-broker-server
          exit 1

      - name: Generate consumer Pact
        working-directory: order-service
        run: |
          ./mvnw \
            -B \
            -Dtest=ProductClientPactTest \
            test

      - name: Show generated Pact files
        run: |
          ls -la order-service/target/pacts

      - name: Publish consumer Pact
        run: |
          docker run \
            --rm \
            --network host \
            -v "${GITHUB_WORKSPACE}/order-service/target/pacts:/pacts:ro" \
            pactfoundation/pact-cli:1.5.0.5 \
            pact-broker publish \
            /pacts \
            --consumer-app-version "${PACT_VERSION}" \
            --branch "${PACT_BRANCH}" \
            --build-url "${BUILD_URL}" \
            --broker-base-url "${PACT_BROKER_BASE_URL}"

      - name: Verify provider Pact
        working-directory: product-service
        env:
          PACT_CONSUMER_BRANCH: ${{ env.PACT_BRANCH }}
          pact.verifier.publishResults: "true"
          pact.provider.version: ${{ env.PACT_VERSION }}
          pact.provider.branch: ${{ env.PACT_BRANCH }}
          pact.verifier.buildUrl: ${{ env.BUILD_URL }}
        run: |
          ./mvnw \
            -B \
            -Dtest=ProductProviderPactTest \
            test

      - name: Can I deploy
        run: |
          docker run \
            --rm \
            --network host \
            pactfoundation/pact-cli:1.5.0.5 \
            pact-broker can-i-deploy \
            --pacticipant order-service \
            --version "${PACT_VERSION}" \
            --pacticipant product-service \
            --version "${PACT_VERSION}" \
            --broker-base-url "${PACT_BROKER_BASE_URL}"

      - name: Show Pact Broker logs on failure
        if: failure()
        run: |
          docker compose logs pact-broker-db pact-broker-server

      - name: Stop Pact Broker
        if: always()
        run: |
          docker compose down -v
